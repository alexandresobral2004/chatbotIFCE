services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_db
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://rag_db:rag_password@db:5432/rag_db
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
